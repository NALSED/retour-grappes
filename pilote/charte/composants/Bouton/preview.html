<!-- @dsCard group="Contrôles" height=420 subtitle="Trois sortes, et la liste close des verbes" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--encre);background:var(--surface-page);-webkit-font-smoothing:antialiased}
.stack{display:flex;flex-direction:column;gap:14px}
.lab{color:var(--encre-pale);display:block}
.card{background:var(--surface);border:1px solid var(--trait);border-radius:var(--rayon-carte);padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.b{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:var(--rayon-controle);
font-family:inherit;cursor:pointer;border:1px solid transparent}
.principal{background:var(--accent);color:#ffffff}
.secondaire{background:var(--surface);color:var(--encre);border-color:var(--trait-fort)}
.danger{background:var(--surface);color:var(--danger);border-color:var(--danger)}
.foc{outline:2px solid var(--accent);outline-offset:2px}
</style>
<div class="stack"><div class="card"><span class="etiquette lab">Principal · un seul par écran</span><div class="row"><button type="button" class="b principal controle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Ajouter une source</button><button type="button" class="b principal controle">Enregistrer</button><button type="button" class="b principal controle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5l11 7-11 7V5z"/></svg>Lancer la recherche</button></div></div><div class="card"><span class="etiquette lab">Secondaire</span><div class="row"><button type="button" class="b secondaire controle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 19.5h4L19 9a2.83 2.83 0 0 0-4-4L4.5 15.5v4zM14 6l4 4"/></svg>Modifier</button><button type="button" class="b secondaire controle">Annuler</button><button type="button" class="b secondaire controle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h6.5v6H4zM13.5 5H20v4h-6.5M13.5 11H20v8h-6.5zM4 13h6.5v6H4z"/></svg>Ranger</button></div></div><div class="card"><span class="etiquette lab">Danger · retirer et supprimer, rien d'autre</span><div class="row"><button type="button" class="b danger controle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zM8 12h8"/></svg>Retirer</button><button type="button" class="b danger controle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M9.5 7V4.5h5V7M6.5 7l.9 13h9.2l.9-13M10.5 11v5.5M13.5 11v5.5"/></svg>Supprimer</button></div></div><div class="card"><span class="etiquette lab">Au clavier</span><div class="row"><button type="button" class="b principal controle foc">Enregistrer</button><button type="button" class="b secondaire controle foc">Annuler</button></div></div></div>
