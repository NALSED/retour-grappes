<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--encre);background:var(--surface-page);-webkit-font-smoothing:antialiased}
.lab{color:var(--encre-pale);display:block}
.cv{position:relative;height:250px;border:1px solid var(--trait);border-radius:var(--rayon-carte);
background-color:var(--surface-creuse);background-image:radial-gradient(#c9cdd2 1px,transparent 1px);
background-size:18px 18px;overflow:hidden}
.nd{position:absolute;width:132px;margin-left:-34px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:2}
.tl{position:relative;width:64px;height:64px;border-radius:var(--rayon-tuile);border:1.5px solid;
display:flex;align-items:center;justify-content:center;cursor:grab}
.port{position:absolute;top:25px;width:14px;height:14px;border-radius:var(--rayon-rond);
background:var(--surface);border:1.5px solid var(--trait-fort);padding:0}
.pin{left:-7px}
.pout{right:-7px;cursor:crosshair}
.rm{position:absolute;right:-9px;top:-9px;width:20px;height:20px;padding:0;display:flex;align-items:center;
justify-content:center;color:var(--encre-douce);background:var(--surface);border:1px solid var(--trait-fort);
border-radius:var(--rayon-rond);cursor:pointer}
.nm{text-align:center;line-height:1.25;max-width:130px}
.sb{color:var(--encre-pale);margin-top:-6px}
svg.links{position:absolute;left:0;top:0;pointer-events:none}
</style>
