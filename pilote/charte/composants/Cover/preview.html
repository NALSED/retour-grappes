<!-- @dsCard height=288 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--surface-page);font-family:var(--font-sans);color:var(--encre);
-webkit-font-smoothing:antialiased}
.cover{position:relative;width:960px;height:288px;overflow:hidden}
.art{position:absolute;left:0;top:0}
.slab{fill:var(--accent)}
.satA{fill:var(--role-verifier)}
.satB{fill:var(--role-enrichir)}
.satC{fill:var(--encre)}
.tint{fill:var(--accent-fond)}
.dOnAccent{fill:var(--accent-fond)}
.dOnTint{fill:var(--accent)}
.dLight{fill:var(--surface-page)}
.txt{position:absolute;left:48px;bottom:34px;width:440px}
.nom{margin:0;font-size:88px;line-height:.92;font-weight:600;letter-spacing:-.02em;color:var(--encre)}
.tag{margin:16px 0 0;font-size:13px;line-height:18px;color:var(--encre-pale)}
</style>
<!--
  Blocs : accent 152x232 rx rayon-tuile, role-verifier et role-enrichir 104x104 rx rayon-tuile,
          encre 128x68 rx rayon-carte, accent-fond 128x140 rx rayon-tuile.
  Disposition : une dalle haute et quatre satellites, gouttiere de 24 px (espace-6) partout, boite x 504-936.
  Trame : motif litteral — une grappe est un amas, donc des triades de disques, r 8 px (espace-2), pas de 24 px.
  Echelles : abscisses et ordonnees par multiples de 24, rayons rayon-tuile 14 et rayon-carte 10.
-->
<div class="cover">
<svg class="art" width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
  <rect class="slab"  x="504" y="28"  width="152" height="232" rx="14"/>
  <rect class="satA"  x="680" y="28"  width="104" height="104" rx="14"/>
  <rect class="satB"  x="680" y="156" width="104" height="104" rx="14"/>
  <rect class="satC"  x="808" y="28"  width="128" height="68"  rx="10"/>
  <rect class="tint"  x="808" y="120" width="128" height="140" rx="14"/>
  <circle class="dOnAccent" cx="556" cy="80" r="8"/><circle class="dOnAccent" cx="544" cy="101" r="8"/><circle class="dOnAccent" cx="568" cy="101" r="8"/>
  <circle class="dOnAccent" cx="604" cy="170" r="8"/><circle class="dOnAccent" cx="592" cy="191" r="8"/><circle class="dOnAccent" cx="616" cy="191" r="8"/>
  <circle class="dLight" cx="732" cy="58" r="8"/><circle class="dLight" cx="720" cy="79" r="8"/><circle class="dLight" cx="744" cy="79" r="8"/>
  <circle class="dLight" cx="732" cy="196" r="8"/><circle class="dLight" cx="720" cy="217" r="8"/><circle class="dLight" cx="744" cy="217" r="8"/>
  <circle class="dLight" cx="872" cy="52" r="8"/><circle class="dLight" cx="860" cy="73" r="8"/><circle class="dLight" cx="884" cy="73" r="8"/>
  <circle class="dOnTint" cx="872" cy="170" r="8"/><circle class="dOnTint" cx="860" cy="191" r="8"/><circle class="dOnTint" cx="884" cy="191" r="8"/>
</svg>
  <div class="txt">
    <p class="nom">Charte<br>grappes</p>
    <p class="tag">Un seul jeu de couleurs, de mots et de pictogrammes pour tout le pilote.</p>
  </div>
</div>
